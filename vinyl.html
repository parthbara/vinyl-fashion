<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Threads - Vinyl Experience</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background-color: #09090b; 
            color: white; 
            font-family: 'Inter', sans-serif;
        }
        @keyframes spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- ICONS (Inline SVGs for zero dependencies) ---
    const IconPlay = ({ size=24, className="" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    );
    const IconPause = ({ size=24, className="" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    );
    const IconDisc = ({ size=24, className, style }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
    );
    const IconBag = ({ size=24, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    );
    const IconX = ({ size=24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    );
    const IconVol = ({ size=24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    );
    const IconMute = ({ size=24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    );
    const IconArrow = ({ size=24 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    );

    // --- DATA ---
    const ALBUMS = [
        {
            id: 'dark-side',
            title: 'Dark Side Threads',
            artist: 'Pink Floyd',
            year: '1973',
            cover: 'https://images.unsplash.com/photo-1535905557558-afc4877a26fc?q=80&w=1000&auto=format&fit=crop', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
            theme: {
                bg: '#09090b',
                text: '#fafafa',
                accent: '#ec4899', 
                secondary: '#27272a'
            },
            products: [
                { id: 1, name: 'Prism Tee', price: 45, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=500' },
                { id: 2, name: 'Lunar Hoodie', price: 85, image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&q=80&w=500' },
                { id: 3, name: 'Eclipse Cap', price: 35, image: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&q=80&w=500' },
            ]
        },
        {
            id: 'blonde',
            title: 'Blonde Capsule',
            artist: 'Frank Ocean',
            year: '2016',
            cover: 'https://images.unsplash.com/photo-1619983081563-430f63602796?q=80&w=1000&auto=format&fit=crop', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
            theme: {
                bg: '#f0fdf4',
                text: '#14532d', 
                accent: '#16a34a',
                secondary: '#dcfce7'
            },
            products: [
                { id: 4, name: 'Nights Racer Jacket', price: 120, image: 'https://images.unsplash.com/photo-1559551409-dadc959f76b8?auto=format&fit=crop&q=80&w=500' },
                { id: 5, name: 'Ivy Knit Sweater', price: 90, image: 'https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&q=80&w=500' },
            ]
        },
        {
            id: 'currents',
            title: 'Currents Drop',
            artist: 'Tame Impala',
            year: '2015',
            cover: 'https://images.unsplash.com/photo-1504509546545-e000b4a62953?q=80&w=1000&auto=format&fit=crop', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
            theme: {
                bg: '#1e1b4b', 
                text: '#e0e7ff', 
                accent: '#818cf8', 
                secondary: '#312e81'
            },
            products: [
                { id: 6, name: 'Let It Happen Tee', price: 45, image: 'https://images.unsplash.com/photo-1503341455253-b2e72333dbdb?auto=format&fit=crop&q=80&w=500' },
                { id: 7, name: 'Disciples Tote', price: 30, image: 'https://images.unsplash.com/photo-1597484662317-9bd7bdda2907?auto=format&fit=crop&q=80&w=500' },
            ]
        }
    ];

    // --- SUB-COMPONENTS ---

    const VinylRecord = ({ isPlaying, cover, accentColor }) => {
        return (
            <div className="relative group cursor-pointer transition-transform duration-500 hover:scale-105">
                <div 
                    className="relative w-64 h-64 md:w-96 md:h-96 rounded-full shadow-2xl overflow-hidden border-2 border-white/10"
                    style={{
                        boxShadow: isPlaying ? `0 0 60px -10px ${accentColor}` : '0 20px 25px -5px rgba(0, 0, 0, 0.5)',
                        background: 'conic-gradient(#1a1a1a 0%, #000 10%, #1a1a1a 20%, #000 30%, #1a1a1a 40%, #000 50%, #1a1a1a 60%, #000 70%, #1a1a1a 80%, #000 90%, #1a1a1a 100%)',
                        animation: isPlaying ? 'spin 3s linear infinite' : 'none',
                        transition: 'box-shadow 0.5s ease'
                    }}
                >
                    <div className="absolute inset-[28%] rounded-full overflow-hidden border-4 border-black/80">
                        <img src={cover} alt="Cover" className="w-full h-full object-cover" />
                    </div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-black rounded-full border border-white/20"></div>
                </div>

                {!isPlaying && (
                    <div className="absolute inset-0 flex items-center justify-center bg-black/30 rounded-full backdrop-blur-[2px]">
                        <div className="bg-white/10 p-4 rounded-full backdrop-blur-md border border-white/20">
                            <IconPlay size={48} className="text-white fill-white" />
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const ProductCard = ({ product, theme, onAdd }) => (
        <div className="group relative flex flex-col overflow-hidden rounded-xl bg-white/5 transition-all hover:bg-white/10">
            <div className="aspect-[4/5] w-full overflow-hidden bg-gray-900">
                <img 
                    src={product.image} 
                    alt={product.name} 
                    className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
                />
            </div>
            <div className="flex flex-1 flex-col p-4" style={{ backgroundColor: theme.secondary }}>
                <h3 className="font-medium" style={{ color: theme.text }}>{product.name}</h3>
                <div className="mt-2 flex items-center justify-between">
                    <span className="text-sm opacity-80" style={{ color: theme.text }}>${product.price}</span>
                    <button 
                        onClick={() => onAdd(product)}
                        className="rounded-full px-3 py-1 text-xs font-bold uppercase tracking-wider transition-transform active:scale-95"
                        style={{ backgroundColor: theme.accent, color: theme.bg }}
                    >
                        Add
                    </button>
                </div>
            </div>
        </div>
    );

    // --- MAIN APP ---

    function App() {
        const [currentAlbumIdx, setCurrentAlbumIdx] = useState(0);
        const [isPlaying, setIsPlaying] = useState(false);
        const [isMuted, setIsMuted] = useState(false);
        const [cart, setCart] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const audioRef = useRef(null);

        const album = ALBUMS[currentAlbumIdx];
        const theme = album.theme;

        useEffect(() => {
            if (audioRef.current) {
                audioRef.current.src = album.audio;
                if (isPlaying) {
                    audioRef.current.play().catch(() => setIsPlaying(false));
                }
            }
        }, [currentAlbumIdx]);

        const togglePlay = () => {
            if (!audioRef.current) return;
            if (isPlaying) {
                audioRef.current.pause();
            } else {
                audioRef.current.play();
            }
            setIsPlaying(!isPlaying);
        };

        const toggleMute = (e) => {
            e.stopPropagation();
            if (!audioRef.current) return;
            audioRef.current.muted = !isMuted;
            setIsMuted(!isMuted);
        };

        const addToCart = (product) => {
            setCart([...cart, product]);
            setIsCartOpen(true);
        };

        return (
            <div 
                className="min-h-screen transition-colors duration-700 ease-in-out font-sans"
                style={{ backgroundColor: theme.bg, color: theme.text }}
            >
                {/* HEADER */}
                <header className="fixed top-0 z-50 w-full border-b border-white/5 px-6 py-4 backdrop-blur-md">
                    <div className="mx-auto flex max-w-7xl items-center justify-between">
                        <div className="flex items-center gap-2">
                            <IconDisc className="animate-pulse" style={{ color: theme.accent }} />
                            <span className="font-bold tracking-tight">MUSIC.THREADS</span>
                        </div>
                        
                        <div className="flex items-center gap-6">
                            <nav className="hidden md:flex gap-4 text-sm font-medium opacity-70">
                                {ALBUMS.map((a, idx) => (
                                    <button
                                        key={a.id}
                                        onClick={() => {
                                            if (currentAlbumIdx !== idx) {
                                                setIsPlaying(false);
                                                setCurrentAlbumIdx(idx);
                                            }
                                        }}
                                        className={`hover:opacity-100 transition-opacity ${currentAlbumIdx === idx ? 'opacity-100 underline underline-offset-4' : ''}`}
                                        style={{ textDecorationColor: theme.accent }}
                                    >
                                        {a.title}
                                    </button>
                                ))}
                            </nav>
                            <button 
                                onClick={() => setIsCartOpen(!isCartOpen)}
                                className="relative p-2 rounded-full hover:bg-white/10"
                            >
                                <IconBag size={20} />
                                {cart.length > 0 && (
                                    <span 
                                        className="absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-bold"
                                        style={{ backgroundColor: theme.accent, color: theme.bg }}
                                    >
                                        {cart.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </div>
                </header>

                {/* MAIN CONTENT */}
                <main className="pt-24 pb-20 px-6">
                    <div className="mx-auto max-w-7xl">
                        
                        {/* HERO */}
                        <div className="flex flex-col md:flex-row items-center justify-between gap-12 py-12">
                            
                            {/* Vinyl Player Component */}
                            <div className="flex-1 flex flex-col items-center">
                                <div onClick={togglePlay}>
                                    <VinylRecord 
                                        isPlaying={isPlaying} 
                                        cover={album.cover} 
                                        accentColor={theme.accent} 
                                    />
                                </div>
                                
                                <div className="mt-8 flex items-center gap-6">
                                    <div className="text-center">
                                        <p className="text-[10px] uppercase tracking-widest opacity-60">Now Spinning</p>
                                        <h2 className="text-2xl font-bold tracking-tighter leading-none mt-1">{album.title}</h2>
                                        <p className="text-sm opacity-80 mt-1">{album.artist} • {album.year}</p>
                                    </div>
                                    <div className="h-8 w-[1px] bg-current opacity-20"></div>
                                    <button 
                                        onClick={toggleMute}
                                        className="p-3 rounded-full border border-current opacity-50 hover:opacity-100 transition-opacity"
                                    >
                                        {isMuted ? <IconMute size={18} /> : <IconVol size={18} />}
                                    </button>
                                </div>
                            </div>

                            {/* Hero Text */}
                            <div className="flex-1 max-w-lg">
                                <span className="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4" style={{ backgroundColor: theme.secondary, color: theme.accent }}>
                                    New Collection
                                </span>
                                <h1 className="text-5xl md:text-7xl font-bold tracking-tighter mb-6 leading-[0.9]">
                                    WEAR THE <br/>
                                    <span style={{ color: theme.accent }}>SOUND.</span>
                                </h1>
                                <p className="opacity-70 text-lg mb-8 leading-relaxed">
                                    An immersive apparel experience. Select an album to transform the store's atmosphere and browse the limited edition capsule collection.
                                </p>
                                <button 
                                    onClick={() => document.getElementById('products').scrollIntoView({ behavior: 'smooth' })}
                                    className="group flex items-center gap-2 px-6 py-3 rounded-md font-bold transition-all hover:gap-4"
                                    style={{ backgroundColor: theme.accent, color: theme.bg }}
                                >
                                    Shop Collection <IconArrow size={18} />
                                </button>
                            </div>
                        </div>

                        {/* PRODUCTS */}
                        <section id="products" className="py-20">
                            <div className="flex items-center justify-between mb-8">
                                <h3 className="text-2xl font-bold uppercase tracking-wide">Merch List</h3>
                                <div className="h-[1px] flex-1 bg-current opacity-20 ml-6"></div>
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {album.products.map(product => (
                                    <ProductCard 
                                        key={product.id} 
                                        product={product} 
                                        theme={theme} 
                                        onAdd={addToCart} 
                                    />
                                ))}
                            </div>
                        </section>

                    </div>
                </main>

                {/* CART SIDEBAR */}
                {isCartOpen && (
                    <div className="fixed inset-0 z-[100] flex justify-end">
                        <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                        <div 
                            className="relative w-full max-w-md h-full shadow-2xl p-6 flex flex-col"
                            style={{ backgroundColor: theme.bg, borderLeft: `1px solid ${theme.secondary}` }}
                        >
                            <div className="flex items-center justify-between mb-8">
                                <h2 className="text-xl font-bold uppercase">Cart ({cart.length})</h2>
                                <button onClick={() => setIsCartOpen(false)}><IconX /></button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto space-y-4 hide-scrollbar">
                                {cart.length === 0 ? (
                                    <p className="opacity-50 text-center mt-10">Your cart is empty.</p>
                                ) : (
                                    cart.map((item, i) => (
                                        <div key={i} className="flex items-center gap-4 p-3 rounded-lg" style={{ backgroundColor: theme.secondary }}>
                                            <img src={item.image} className="w-12 h-12 object-cover rounded" alt="Item" />
                                            <div className="flex-1">
                                                <p className="font-medium">{item.name}</p>
                                                <p className="text-sm opacity-70">${item.price}</p>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            <div className="mt-6 pt-6 border-t border-current border-opacity-10">
                                <div className="flex justify-between mb-4 text-xl font-bold">
                                    <span>Total</span>
                                    <span>${cart.reduce((a, b) => a + b.price, 0)}</span>
                                </div>
                                <button 
                                    className="w-full py-4 rounded-lg font-bold uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all"
                                    style={{ backgroundColor: theme.accent, color: theme.bg }}
                                >
                                    Checkout
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                <audio ref={audioRef} loop />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
